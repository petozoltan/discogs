# yaml-language-server: $schema=https://json.schemastore.org/spring-boot-4.0.json

spring:

  application:
    name: discogs

  jpa:
    hibernate:
      ddl-auto: create          # or create-drop / update / none as needed
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2
      settings:
        webAllowOthers: false
        trace: false
  #        webAdminPassword: admin

  datasource:
    url: jdbc:h2:mem:mydb
    username: sa
    password: pwd
    driverClassName: org.h2.Driver



